<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09131c">
  <meta name="description" content="飞船模块随身图鉴：卡图、效果、三级配置与开发笔记。">
  <title>飞船 · 随身卡册</title>
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="brand"><span class="brand-mark" aria-hidden="true">▥</span><div><h1>随身卡册</h1><p>飞船模块图鉴</p></div></div>
    <button id="tools-open" class="quiet">更多</button>
  </header>
  <main>
    <section class="controls" aria-label="查找模块">
      <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索名称、效果或标签" aria-label="搜索名称、效果或标签"></label>
      <div class="filter-row"><select id="tag" aria-label="标签"><option value="">全部标签</option></select><select id="rarity" aria-label="稀有度"><option value="">全部稀有度</option><option value="Common">普通</option><option value="Rare">稀有</option><option value="Epic">史诗</option><option value="Legendary">传说</option></select><select id="tier" aria-label="显示等级"><option value="1">Ⅰ 级</option><option value="2">Ⅱ 级</option><option value="3">Ⅲ 级</option></select></div>
      <div class="view-row"><div class="tabs" aria-label="收藏筛选"><button data-view="all" aria-pressed="true">全部</button><button data-view="favorite" aria-pressed="false">收藏</button><button data-view="review" aria-pressed="false">待改</button><button data-view="notes" aria-pressed="false">笔记</button></div><button id="layout" class="quiet" aria-pressed="false">阅读视图</button></div>
    </section>
    <div class="result-line"><span id="count" aria-live="polite">正在加载卡册…</span><span id="version"></span></div>
    <section id="cards" class="cards" aria-label="模块卡牌"></section>
    <div id="empty" class="empty" hidden><h2>这里还没有卡牌</h2><p id="empty-text"></p><button id="reset">查看全部卡牌</button></div>
    <footer><span id="footer-version"></span><p>收藏与笔记保存在当前浏览器，可在「更多」中导出备份。</p></footer>
  </main>
  <dialog id="detail" aria-labelledby="detail-title"><div class="detail-head"><div><p id="detail-meta" class="eyebrow"></p><h2 id="detail-title"></h2></div><button id="close-detail" class="quiet">关闭</button></div><div id="detail-content"></div></dialog>
  <dialog id="tools" aria-labelledby="tools-title"><div class="detail-head"><h2 id="tools-title">卡册工具</h2><button id="close-tools" class="quiet">关闭</button></div><div class="tools-content"><h3>离线查看</h3><p>联网时保存全部卡图和效果，之后可离线打开已保存的这一版。更新后可再次保存。</p><button id="offline">保存全部卡牌到手机</button><p id="offline-status" role="status"></p><h3>笔记备份</h3><p>笔记不会自动同步到其他设备。导出后可在电脑或另一台手机导入；同一卡牌保留更新时间较新的记录。</p><div class="actions"><button id="export">导出收藏与笔记</button><button id="import">导入备份</button></div><input id="import-file" type="file" accept="application/json,.json" hidden><h3>状态规则</h3><div id="rules"></div></div></dialog>
  <div id="toast" role="status" class="toast" hidden></div>
  <noscript><p>请启用 JavaScript 来浏览卡牌。</p></noscript>
</body>
</html>
